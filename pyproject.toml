[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "website-audit-leads"
version = "0.1.0"
description = "Thin Python client for the hosted Website Audit Leads Apify Actor. Preview audiences and export review-ready website opportunities."
readme = "README.md"
license = "MIT"
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["website-audit", "seo-leads", "lead-generation", "apify", "python-sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3"
]

[project.urls]
Homepage = "https://github.com/apivault-labs/website-audit-leads-python"
"Apify Actor" = "https://apify.com/apivault_labs/website-audit-leads"

[tool.setuptools.packages.find]
include = ["website_audit_leads*"]
